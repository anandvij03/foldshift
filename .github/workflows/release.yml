name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or version name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_ext: .exe
            archive_ext: .zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_ext: ""
            archive_ext: .tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_ext: ""
            archive_ext: .tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_ext: ""
            archive_ext: .tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Extract tag name
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build Foldshift Core
        run: cargo build -p foldshift-cli --release --no-default-features --target ${{ matrix.target }} --locked

      - name: Build Foldshift Images
        run: cargo build -p foldshift-cli --release --features image --target ${{ matrix.target }} --locked

      - name: Build Foldshift Web
        run: cargo build -p foldshift-web --release --target ${{ matrix.target }} --locked

      - name: Package artifacts
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          VERSION_CLEAN="${VERSION#v}"
          TARGET="${{ matrix.target }}"
          EXT="${{ matrix.binary_ext }}"
          ARCH_EXT="${{ matrix.archive_ext }}"
          DIST_DIR="dist_packages"
          mkdir -p "$DIST_DIR"

          package_binary() {
            local PROFILE=$1
            local BIN_NAME=$2
            local PKG_NAME="foldshift-${PROFILE}-${VERSION_CLEAN}-${TARGET}"
            local STAGE_DIR="stage_${PROFILE}"
            mkdir -p "$STAGE_DIR"

            cp "target/${TARGET}/release/${BIN_NAME}${EXT}" "$STAGE_DIR/${BIN_NAME}${EXT}"
            [ -f "LICENSE" ] && cp "LICENSE" "$STAGE_DIR/"
            [ -f "README.md" ] && cp "README.md" "$STAGE_DIR/"

            if [ "$ARCH_EXT" = ".zip" ]; then
              7z a -tzip "${DIST_DIR}/${PKG_NAME}.zip" "./${STAGE_DIR}/*"
            else
              tar -czvf "${DIST_DIR}/${PKG_NAME}.tar.gz" -C "$STAGE_DIR" .
            fi
            rm -rf "$STAGE_DIR"
          }

          package_binary "core" "foldshift"
          # rename binary for image profile to distinct archive
          package_binary "images" "foldshift"
          package_binary "web" "foldshift-web"

      - name: Generate SHA-256 Checksums
        shell: bash
        run: |
          cd dist_packages
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > checksums-${{ matrix.target }}.txt
          else
            shasum -a 256 * > checksums-${{ matrix.target }}.txt
          fi

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_packages/*
          tag_name: ${{ steps.meta.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
