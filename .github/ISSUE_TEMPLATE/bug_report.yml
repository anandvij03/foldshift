name: Bug report
description: Report incorrect conversion or CLI behavior
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Use synthetic or redacted samples; never upload private files."
  - type: input
    id: version
    attributes:
      label: Version
      description: "Output of foldshift --version, or the commit you built."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and architecture
      placeholder: "Windows 11 x64, macOS arm64, or Ubuntu x64"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and command
      description: "Include input/output format and relevant options. Remove private paths."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error output
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Optional synthetic reproduction file
      description: "Only attach files you have permission to publish."
