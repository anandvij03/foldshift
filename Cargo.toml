[workspace]
members = [
    "crates/foldshift-core",
    "crates/foldshift-image",
    "crates/foldshift-pdf",
    "crates/foldshift-cli",
    "crates/foldshift-web",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/anandvij03/foldshift"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive"] }
gif = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
png = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
tiff = { version = "0.11", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
