[package]
name = "foldshift-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "foldshift"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
foldshift-core = { path = "../foldshift-core" }
foldshift-image = { path = "../foldshift-image", optional = true }
foldshift-media = { path = "../foldshift-media" }
foldshift-pdf = { path = "../foldshift-pdf" }
serde_json.workspace = true

[features]
default = ["image"]
image = ["dep:foldshift-image"]
images = ["image"]

[dev-dependencies]
gif.workspace = true
image.workspace = true
tempfile.workspace = true
tiff.workspace = true
